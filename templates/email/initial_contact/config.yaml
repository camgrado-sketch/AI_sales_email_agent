template_name: initial_contact
purpose:
  - cold_outreach
  - brand_introduction
customer_type:
  - designer
  - distributor
  - fit_out_company
recommended_stage:
  - new_lead
subject_template: 'Furniture partnership opportunity for {{CUSTOMER_COMPANY}} | GRADO Contract'
variables:
  - customer_first_name
  - sender_name
  - market_region
  - company_name
  - specific_project_or_detail
  - sender_title
images:
  - portfolio_grid_1
  - portfolio_grid_2
  - portfolio_grid_3
  - portfolio_grid_4
  - portfolio_grid_5
  - portfolio_grid_6
rules:
  - "只回答'GRADO是谁、为什么找你'，不要同时讲奖项、工厂、项目案例、快交和定制"
  - "个性化内容必须来自客户官网、LinkedIn或真实项目"
  - "正文建议控制在80–120个英文单词（不含图片和固定落款）"
  - "CTA只要求一个低门槛动作"
