template_name: final_note
purpose:
  - last_attempt
  - credibility_building
customer_type:
  - designer
  - distributor
  - fit_out_company
recommended_stage:
  - follow_up_no_reply
subject_template: 'One last note about GRADO Contract and {{CUSTOMER_COMPANY}}'
variables:
  - customer_first_name
  - credible_proof
  - company_name
  - sender_name
rules:
  - "可以加入一个经过公司确认的可信证明，如设计奖项、设计师合作、制造能力或相关空间经验，但不要一次堆叠多个"
  - "不要未经批准点名保密项目，也不要把知名客户名称当成邮件的主要说服力"
  - "用'3–5个相关系列'替代'整本catalogue'"
  - "如果第三封仍未回复，暂停一对一追发30–45天"
