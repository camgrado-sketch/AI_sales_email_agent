name: Python CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Test with pytest
        id: tests
        continue-on-error: true
        run: pytest -q --junitxml=pytest.xml 2>&1 | tee pytest.log
      - name: Upload failure report
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: pytest-failure-${{ github.run_id }}
          path: |
            pytest.log
            pytest.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Publish failure summary to PR
        if: ${{ steps.tests.outcome == 'failure' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ci-failure-summary -->';
            const tail = fs.readFileSync('pytest.log', 'utf8')
              .split('\n').slice(-120).join('\n').slice(-12000);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '## Python CI tests failed',
              '',
              `- Commit: ${context.sha.slice(0, 7)}`,
              `- Workflow run: ${runUrl}`,
              `- Full report artifact: pytest-failure-${context.runId}`,
              '',
              '<details><summary>Last 120 lines of pytest output</summary>',
              '',
              '~~~text',
              tail,
              '~~~',
              '</details>'
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(
              comment => comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
      - name: Resolve previous failure summary
        if: ${{ steps.tests.outcome == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- ci-failure-summary -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(
              comment => comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: [
                  marker,
                  '## Python CI recovered',
                  '',
                  `- Latest commit: ${context.sha.slice(0, 7)}`,
                  `- Successful workflow run: ${runUrl}`,
                  '- The previous failure is resolved.'
                ].join('\n')
              });
            }
      - name: Preserve test failure status
        if: steps.tests.outcome == 'failure'
        run: exit 1
